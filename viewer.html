<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đọc & Xem Ý Tưởng / Spec Viewer - ChemPhys & MadChaosIdea</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main styles -->
    <link rel="stylesheet" href="static/css/styles.css">
    <style>
        body.reader-body {
            background-color: #040508 !important;
            display: block !important;
            min-height: 100vh;
        }
        #reader-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            color: var(--text-secondary);
        }
        #reader-main-view {
            display: none;
        }
        /* Custom formatting for scientific text specs */
        .text-page {
            width: min(840px, calc(100vw - 32px));
            min-height: calc(100vh - 180px);
            padding: clamp(24px, 5vw, 56px);
            background: #090c15;
            border: 1px solid rgba(6, 182, 212, 0.2);
            border-radius: 12px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            color: #f1f5f9;
            font-family: 'Fira Code', monospace, Georgia, serif;
            font-size: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .text-page h3 {
            color: var(--accent-cyan);
            font-size: 20px;
            font-family: 'Outfit', sans-serif;
            margin-top: 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(6, 182, 212, 0.3);
            padding-bottom: 4px;
        }
        .text-page p {
            margin-bottom: 1.2em;
        }
        .text-page .spec-warning {
            background: rgba(245, 158, 11, 0.12);
            border-left: 4px solid var(--accent-amber);
            padding: 12px 16px;
            margin: 14px 0;
            color: #fde047;
            font-weight: 600;
        }
    </style>
</head>
<body class="reader-body">

    <!-- Loading Panel -->
    <div id="reader-loading">
        <i class="fa-solid fa-atom fa-spin" style="font-size: 52px; color: var(--accent-cyan); margin-bottom: 16px;"></i>
        <p>Đang tải trình xem ý tưởng khoa học... / Launching Spec Viewer...</p>
    </div>

    <!-- Main Reader View (Initially Hidden) -->
    <div id="reader-main-view">
        <!-- Top Navigation -->
        <header class="reader-header">
            <div class="reader-nav">
                <a href="#" id="back-link" class="reader-title">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span id="comic-title" class="comic-name-text">Tên Ý Tưởng</span>
                </a>
                
                <div class="reader-controls">
                    <button class="reader-btn active" id="btn-scroll-mode" title="Cuộn dọc liên tục / Scroll Mode">
                        <i class="fa-solid fa-arrows-up-down"></i> Cuộn Dọc
                    </button>
                    <button class="reader-btn" id="btn-slide-mode" title="Từng trang / Slider Mode">
                        <i class="fa-solid fa-file-lines"></i> Từng Trang
                    </button>
                    <button class="reader-btn" id="btn-fullscreen" title="Bật/Tắt Toàn Màn Hình">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Reading Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <!-- Mode 1: Vertical Scroll Mode -->
        <div class="scroll-container" id="scroll-reader-view">
            <!-- Rendered dynamically by JavaScript -->
        </div>

        <!-- Mode 2: Page-by-Page Slider Mode -->
        <div class="slider-container" id="slider-reader-view">
            <div class="slider-stage">
                <img id="slider-image-element" src="" alt="Sơ đồ ý tưởng" class="slider-image">
                <div id="slider-text-element" class="text-page" style="display: none;"></div>
                
                <button class="slider-nav slider-nav-prev" id="slider-prev-btn" title="Trang Trước">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <button class="slider-nav slider-nav-next" id="slider-next-btn" title="Trang Sau">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
            
            <div class="reader-footer-nav" id="slider-footer-controls" style="display: flex;">
                <button class="reader-btn" id="footer-prev-btn"><i class="fa-solid fa-angle-left"></i> Trước</button>
                <span id="page-indicator" style="font-weight: 600; color: var(--text-primary);">Trang 1 / 1</span>
                <button class="reader-btn" id="footer-next-btn">Sau <i class="fa-solid fa-angle-right"></i></button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="static/js/stories.js"></script>
    <script src="static/js/db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const loadingPanel = document.getElementById('reader-loading');
            const mainView = document.getElementById('reader-main-view');
            const backLink = document.getElementById('back-link');
            const comicTitleEl = document.getElementById('comic-title');
            
            const scrollReaderView = document.getElementById('scroll-reader-view');
            const sliderReaderView = document.getElementById('slider-reader-view');
            const btnScrollMode = document.getElementById('btn-scroll-mode');
            const btnSlideMode = document.getElementById('btn-slide-mode');
            const btnFullscreen = document.getElementById('btn-fullscreen');
            
            const sliderImg = document.getElementById('slider-image-element');
            const pageIndicator = document.getElementById('page-indicator');
            const progressFill = document.getElementById('progress-fill');
            
            const btnPrev = document.getElementById('slider-prev-btn');
            const btnNext = document.getElementById('slider-next-btn');
            const ftrPrev = document.getElementById('footer-prev-btn');
            const ftrNext = document.getElementById('footer-next-btn');

            // Parse parameters
            const urlParams = new URLSearchParams(window.location.search);
            const comicId = urlParams.get('id');

            if (!comicId) {
                loadingPanel.innerHTML = '<p style="color:#f87171;">Lỗi: Không tìm thấy ID ý tưởng.</p><a href="index.html" class="btn btn-primary" style="margin-top:15px;">Quay lại Trang Chủ</a>';
                return;
            }

            // Set back button link to idea.html
            backLink.href = `idea.html?id=${comicId}`;

            try {
                const dbHandler = window.IdeaDB || window.ComicDB;
                const staticStoryId = comicId.startsWith('static-') ? comicId.replace('static-', '') : '';
                const item = staticStoryId
                    ? (window.StaticStories || []).find(story => story.id === staticStoryId)
                    : await dbHandler.getComic(comicId);

                if (!item) {
                    loadingPanel.innerHTML = '<p style="color:#f87171;">Lỗi: Ý tưởng không tồn tại.</p><a href="index.html" class="btn btn-primary" style="margin-top:15px;">Quay lại Trang Chủ</a>';
                    return;
                }

                const pages = staticStoryId ? [] : await dbHandler.getComicPages(comicId);
                const textPages = paginateStoryText(item.storyText || '');
                const isTextStory = textPages.length > 0;

                if (pages.length === 0 && !isTextStory) {
                    loadingPanel.innerHTML = '<p style="color:#f87171;">Lỗi: Ý tưởng không có nội dung.</p><a href="idea.html?id=' + comicId + '" class="btn btn-primary" style="margin-top:15px;">Quay lại</a>';
                    return;
                }

                // Populate title
                comicTitleEl.innerText = item.title;
                document.title = `Đọc: ${item.title} - ChemPhys & MadChaosIdea`;

                // Cache page URLs
                const pageUrls = pages.map(p => ({
                    number: p.pageNumber,
                    url: URL.createObjectURL(p.pageBlob)
                }));
                const totalPages = isTextStory ? textPages.length : pageUrls.length;

                // Populate Scroll Mode Container
                if (isTextStory) {
                    textPages.forEach((text, index) => {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'scroll-page';
                        pageDiv.setAttribute('data-page', index + 1);
                        pageDiv.innerHTML = `<div class="text-page">${formatStoryText(text)}</div>`;
                        scrollReaderView.appendChild(pageDiv);
                    });
                } else {
                    pageUrls.forEach(p => {
                        const pageDiv = document.createElement('div');
                        pageDiv.className = 'scroll-page';
                        pageDiv.setAttribute('data-page', p.number);
                        pageDiv.innerHTML = `<img src="${p.url}" alt="Sơ đồ ${p.number}" loading="lazy">`;
                        scrollReaderView.appendChild(pageDiv);
                    });
                }

                // Hide loading, show main viewer
                loadingPanel.style.display = 'none';
                mainView.style.display = 'block';

                // Slider navigation variables
                let currentMode = 'scroll';
                let currentPageIndex = 0;

                // Load progress
                const savedMode = localStorage.getItem(`spec_mode_${comicId}`);
                const savedPage = localStorage.getItem(`spec_page_${comicId}`);
                
                if (savedPage) {
                    currentPageIndex = Math.max(0, Math.min(parseInt(savedPage) - 1, totalPages - 1));
                }

                if (isTextStory || savedMode === 'slide') {
                    setMode('slide');
                } else {
                    setMode('scroll');
                    if (savedPage && parseInt(savedPage) > 1) {
                        setTimeout(() => {
                            const targetPageEl = document.querySelector(`.scroll-page[data-page="${savedPage}"]`);
                            if (targetPageEl) {
                                targetPageEl.scrollIntoView({ behavior: 'smooth' });
                            }
                        }, 200);
                    }
                }

                // Mode Selector
                function setMode(mode) {
                    currentMode = mode;
                    localStorage.setItem(`spec_mode_${comicId}`, mode);
                    
                    if (mode === 'scroll') {
                        scrollReaderView.style.display = 'flex';
                        sliderReaderView.style.display = 'none';
                        btnScrollMode.classList.add('active');
                        btnSlideMode.classList.remove('active');
                        updateProgress();
                    } else {
                        scrollReaderView.style.display = 'none';
                        sliderReaderView.style.display = 'flex';
                        btnScrollMode.classList.remove('active');
                        btnSlideMode.classList.add('active');
                        renderSlidePage();
                    }
                }

                // Render Slide page
                function renderSlidePage() {
                    const sliderText = document.getElementById('slider-text-element');
                    const sliderStage = sliderText.parentElement;
                    const pageNumber = currentPageIndex + 1;

                    if (isTextStory) {
                        sliderStage.classList.add('text-slider-stage');
                        sliderImg.style.display = 'none';
                        sliderImg.removeAttribute('src');
                        sliderText.style.display = 'block';
                        sliderText.innerHTML = formatStoryText(textPages[currentPageIndex]);
                    } else {
                        const page = pageUrls[currentPageIndex];
                        sliderStage.classList.remove('text-slider-stage');
                        sliderText.style.display = 'none';
                        sliderImg.style.display = 'block';
                        sliderImg.src = page.url;
                    }

                    pageIndicator.innerText = `Trang ${pageNumber} / ${totalPages}`;
                    localStorage.setItem(`spec_page_${comicId}`, pageNumber);
                    updateProgress();
                    window.scrollTo({ top: 0, behavior: 'instant' });
                }

                // Progress Bar Handler
                function updateProgress() {
                    let percentage = 0;
                    if (currentMode === 'scroll') {
                        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
                        if (scrollHeight > 0) {
                            percentage = (window.scrollY / scrollHeight) * 100;
                        }
                    } else {
                        percentage = ((currentPageIndex + 1) / totalPages) * 100;
                    }
                    progressFill.style.width = `${percentage}%`;
                }

                // Slide actions
                function nextPage() {
                    if (currentPageIndex < totalPages - 1) {
                        currentPageIndex++;
                        renderSlidePage();
                    }
                }

                function prevPage() {
                    if (currentPageIndex > 0) {
                        currentPageIndex--;
                        renderSlidePage();
                    }
                }

                // Navigation Listeners
                btnNext.addEventListener('click', nextPage);
                btnPrev.addEventListener('click', prevPage);
                ftrNext.addEventListener('click', nextPage);
                ftrPrev.addEventListener('click', prevPage);

                // Image clicks
                sliderImg.addEventListener('click', (e) => {
                    const rect = sliderImg.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    if (x > rect.width / 2) {
                        nextPage();
                    } else {
                        prevPage();
                    }
                });

                // Keyboard listener
                document.addEventListener('keydown', (e) => {
                    if (currentMode === 'slide') {
                        if (e.key === 'ArrowRight' || e.key === ' ') {
                            e.preventDefault();
                            nextPage();
                        } else if (e.key === 'ArrowLeft') {
                            e.preventDefault();
                            prevPage();
                        }
                    }
                });

                // Scroll events
                window.addEventListener('scroll', () => {
                    if (currentMode === 'scroll') {
                        updateProgress();
                        
                        const pageElements = document.querySelectorAll('.scroll-page');
                        let visiblePage = 1;
                        for (let el of pageElements) {
                            const rect = el.getBoundingClientRect();
                            if (rect.top < window.innerHeight / 2 && rect.bottom > window.innerHeight / 2) {
                                visiblePage = el.getAttribute('data-page');
                                break;
                            }
                        }
                        localStorage.setItem(`spec_page_${comicId}`, visiblePage);
                    }
                });

                // Fullscreen Logic
                function toggleFullscreen() {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().catch(err => {
                            console.error(`Fullscreen failed: ${err.message}`);
                        });
                        btnFullscreen.innerHTML = '<i class="fa-solid fa-compress"></i>';
                    } else {
                        document.exitFullscreen();
                        btnFullscreen.innerHTML = '<i class="fa-solid fa-expand"></i>';
                    }
                }
                btnFullscreen.addEventListener('click', toggleFullscreen);

                // Bind mode toggles
                btnScrollMode.addEventListener('click', () => setMode('scroll'));
                btnSlideMode.addEventListener('click', () => setMode('slide'));

                // Clean up Blob URLs on page unload
                window.addEventListener('beforeunload', () => {
                    pageUrls.forEach(p => URL.revokeObjectURL(p.url));
                });

            } catch (err) {
                console.error(err);
                loadingPanel.innerHTML = '<p style="color:#f87171;">Lỗi khi tải nội dung: ' + err.message + '</p><a href="index.html" class="btn btn-primary" style="margin-top:15px;">Quay lại Trang Chủ</a>';
            }

            function paginateStoryText(text) {
                const normalized = text.trim().replace(/\r\n/g, '\n');
                if (!normalized) return [];

                const paragraphs = normalized.split(/\n\s*\n/).map(part => part.trim()).filter(Boolean);
                const pages = [];
                let currentPage = '';
                const maxChars = 1100;

                paragraphs.forEach(paragraph => {
                    if ((currentPage + '\n\n' + paragraph).trim().length > maxChars && currentPage) {
                        pages.push(currentPage);
                        currentPage = paragraph;
                    } else {
                        currentPage = (currentPage ? `${currentPage}\n\n` : '') + paragraph;
                    }
                });

                if (currentPage) pages.push(currentPage);
                return pages;
            }

            function formatStoryText(text) {
                return text
                    .split(/\n\s*\n/)
                    .map(paragraph => {
                        const trimmed = paragraph.trim();
                        if (trimmed.startsWith('WARNING:') || trimmed.startsWith('CAUTION:') || trimmed.startsWith('CẢNH BÁO:')) {
                            return `<div class="spec-warning"><i class="fa-solid fa-triangle-exclamation"></i> ${escapeHTML(trimmed)}</div>`;
                        } else if (trimmed.startsWith('===') || (trimmed.match(/^[0-9]\./) && trimmed.length < 80)) {
                            return `<h3 style="color:var(--accent-cyan); font-weight:700; margin:16px 0 8px;">${escapeHTML(trimmed.replace(/^=+/g, '').replace(/=+$/g, ''))}</h3>`;
                        }
                        return `<p>${escapeHTML(trimmed)}</p>`;
                    })
                    .join('');
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g,
                    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
                );
            }
        });
    </script>
</body>
</html>
